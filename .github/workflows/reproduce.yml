name: reproduce
# Manual partial reproduction (D050); the full sweeps take hours and are not run here
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "synthetic: every step that runs on fixtures; sample: rerun on a small real sample and compare numbers"
        type: choice
        options: [synthetic, sample]
        default: synthetic

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked
      - if: inputs.mode == 'sample'
        run: |
          uv run python -m push_lab.data.download --only kuairand hillstrom obd
          uv run python -m push_lab.data.prepare --only kuairand hillstrom obd
      - run: uv run python -m push_lab.reproduce "$MODE"
        env:
          MODE: ${{ inputs.mode }}
