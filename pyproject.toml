[project]
name = "push-lab"
version = "0.1.0"
description = "Offline lab for push notification recommendation with honest evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "econml==0.17.0",
    "faiss-cpu==1.15.1",
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pyarrow-stubs==20.0.0.20260819",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "scikit-uplift==0.5.1",
]

# CPU-only torch wheels; the PyPI build pulls CUDA libraries on Linux (D017)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# No type information is published for these packages
[[tool.mypy.overrides]]
module = ["econml.*", "sklearn.*", "sklift.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = ["network: needs internet access; deselected by default"]
